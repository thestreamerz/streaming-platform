<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="STREAMERZ" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <title>STREAMERZ - Ultimate Movie & TV Streaming Platform</title>
    <meta name="description" content="Discover, stream, and enjoy unlimited movies and TV shows with STREAMERZ - your ultimate entertainment destination with premium quality streaming." />
    <meta name="keywords" content="streaming, movies, tv shows, entertainment, premium, HD, 4K, online streaming" />
    <meta name="author" content="STREAMERZ" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thestreamerz.app/" />
    <meta property="og:title" content="STREAMERZ - Ultimate Movie & TV Streaming Platform" />
    <meta property="og:description" content="Discover, stream, and enjoy unlimited movies and TV shows with STREAMERZ - your ultimate entertainment destination." />
    <meta property="og:image" content="/icon-512x512.png" />
    <meta property="og:site_name" content="STREAMERZ" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://thestreamerz.app/" />
    <meta property="twitter:title" content="STREAMERZ - Ultimate Movie & TV Streaming Platform" />
    <meta property="twitter:description" content="Discover, stream, and enjoy unlimited movies and TV shows with STREAMERZ - your ultimate entertainment destination." />
    <meta property="twitter:image" content="/icon-512x512.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preload Critical Resources -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" />
    <link rel="preload" href="/src/main.tsx" as="script" />
    
    <!-- DNS Prefetch for Performance -->
    <link rel="dns-prefetch" href="//api.themoviedb.org" />
    <link rel="dns-prefetch" href="//image.tmdb.org" />
    <link rel="dns-prefetch" href="//vidsrc.to" />
    <link rel="dns-prefetch" href="//2embed.cc" />
    
    <!-- Preconnect for Critical Domains -->
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    
    <!-- Performance Hints -->
    <meta http-equiv="Accept-CH" content="DPR, Viewport-Width, Width" />
    
    <!-- Ads disabled: removed AdSense script to prevent banner overlays during splash/loading -->
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 2rem; background: #000; color: #fff; font-family: Arial, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>STREAMERZ requires JavaScript to function properly. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    
    <div id="root">
      <!-- Loading Screen -->
      <div id="loading-screen" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: #fff;
        font-family: Arial, sans-serif;
      ">
        <div style="
          width: 60px;
          height: 60px;
          border: 3px solid #333;
          border-top: 3px solid #fff;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        "></div>
        <h2 style="margin: 0; font-size: 24px; font-weight: 600;">STREAMERZ</h2>
        <p style="margin: 10px 0 0 0; color: #ccc; font-size: 14px;">Loading your entertainment...</p>
      </div>
      
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Hide loading screen when React app loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.transition = 'opacity 0.5s ease-out';
            setTimeout(function() {
              loadingScreen.style.display = 'none';
            }, 500);
          }
        }, 1000);
      });
    </script>
  </body>
</html>
